name: Tests

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          # Coverage floor is the achievable baseline after closing the MVP
          # test gaps. 40% is blocked by the SSH/Docker-bound managers
          # (adguard, dns, nginx, socks5, telemt — 0%, need integration test
          # infra) and will be raised iteratively as that infra lands.
          pytest --cov=app --cov=managers --cov=middleware --cov=config --cov-fail-under=20 --cov-report=term-missing --tb=short -v
        env:
          AWP_DEV: "1"
